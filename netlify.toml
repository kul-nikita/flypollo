[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # GROQ_API_KEY is only ever read server-side in netlify/functions and is not
  # referenced anywhere in the Vite frontend source. It is omitted here because
  # Netlify's secrets scanner flags a coincidental substring match inside the
  # minified client bundle, not an actual leak of the key's value.
  SECRETS_SCAN_OMIT_KEYS = "GROQ_API_KEY"

[dev]
  command = "npm run dev"
  targetPort = 5173

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."generate-mcq"]
  maxDuration = 26

[functions."generate-question"]
  maxDuration = 26
