[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # These keys are public configuration, not credentials: VITE_* values are
  # inlined into the client bundle by Vite, and MODEL_NAME's default is a
  # hardcoded model identifier inside the serverless function bundle. Exclude
  # them from Netlify secrets scanning so the build is not blocked by false
  # positives, while real secrets (e.g. GROQ_API_KEY) stay protected.
  SECRETS_SCAN_OMIT_KEYS = "GROQ_API_KEY,MODEL_NAME,VITE_ADMIN_EMAILS,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_DATABASE_URL,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID"

[dev]
  command = "npm run dev"
  targetPort = 5173

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."generate-mcq"]
  maxDuration = 26

[functions."generate-question"]
  maxDuration = 26
